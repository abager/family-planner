name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (server + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAMILIEPLAN_REQUIRE_BROWSER: "1"   # browser tests must run here, not be skipped
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install axe-core (accessibility test)
        run: |
          npm install --prefix "$RUNNER_TEMP/axe" axe-core@4
          echo "AXE_JS=$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"

      - name: Run tests
        run: pytest -rs

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: familieplan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (modules import inside the image)
        run: docker run --rm -w /app familieplan:ci python -c "import server, selftest; print('ok')"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the full history, not just the latest commit

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
